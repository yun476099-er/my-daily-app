<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>计时器 · 录音 · 事项</title>
<style>
  /* =========================================================
     清新绿色 · 设计变量
     ========================================================= */
  :root{
    --bg:        #f4f9f6;
    --card:      #ffffff;
    --ink:       #2d3a34;
    --ink-2:     #4a5d54;
    --muted:     #8fa89c;
    --line:      #e3ede8;
    --line-2:    #d0e0d8;

    --primary:   #4f9c7d;
    --primary-d: #3f8266;
    --primary-l: #e6f2ec;

    --mint:      #6dbf99;
    --mint-d:    #3d8f6d;
    --mint-l:    #e3f5eb;

    --sand:      #c8c297;
    --sand-l:    #f4f2e4;

    --rose:      #d49a9a;
    --rose-l:    #f7eaea;

    --lilac:     #8fb3a1;
    --lilac-l:   #e6f0eb;

    --shadow-sm: 0 1px 2px rgba(45,58,52,0.04);
    --shadow:    0 1px 3px rgba(45,58,52,0.05), 0 4px 12px rgba(45,58,52,0.04);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{ height: 100%; }

  body{
    margin: 0;
    padding: 10px 12px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    background-image: linear-gradient(180deg, #f7fbf9 0%, #eef6f1 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .wrap{
    max-width: 620px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* =========================================================
     顶部：日期 + 时钟
     ========================================================= */
  .hero{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 2px 2px 11px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 11px;
  }

  /* 日期：突出显示 */
  .date{
    display: inline-block;
    font-size: 14px;
    font-weight: 600;
    color: var(--primary-d);
    letter-spacing: .2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--primary-l);
    padding: 4px 11px;
    border-radius: 8px;
  }

  /* 时钟：弱化处理 */
  .clock{
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    user-select: none;
  }

  /* =========================================================
     Tab 切换
     ========================================================= */
  .tabs{
    display: flex;
    gap: 4px;
    padding: 3px;
    background: #e8f0ec;
    border-radius: 11px;
    margin-bottom: 12px;
  }

  .tabs button{
    flex: 1;
    padding: 7px 0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-2);
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .18s, color .18s, box-shadow .18s;
  }
  .tabs button.active{
    background: #fff;
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(45,58,52,0.08);
  }

  .panel.hidden{ display: none !important; }

  /* =========================================================
     通用按钮 & 工具条
     ========================================================= */
  .btn{
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 15px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line-2);
    border-radius: 9px;
    cursor: pointer;
    transition: background .16s, border-color .16s, transform .08s;
  }
  .btn:hover{ background: #f4f9f6; border-color: #b8cec2; }
  .btn:active{ transform: scale(.98); }
  .btn.primary{
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(79,156,125,0.28);
  }
  .btn.primary:hover{ background: var(--primary-d); border-color: var(--primary-d); }
  .btn.sm{ font-size: 12px; padding: 5px 12px; }

  .bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 9px;
  }
  .count{ font-size: 12px; color: var(--muted); }
  /* ---------- 事项 Day 行 ---------- */
    .todo-dayline{
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 4px;
    font-size: 15px;
    font-weight: 700;
    color: var(--primary-d);
    letter-spacing: .3px;
    flex: 1;
    min-width: 0;
  }
  .todo-day-label{
    color: var(--primary-d);
  }
    .todo-dayline .todo-day-input{
    flex: 0 0 auto;
    width: 42px;
    padding: 2px 4px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--primary-d);
    text-align: center;
    background: var(--primary-l);
    border: 1.5px solid var(--primary);
    border-radius: 6px;
    outline: none;
    transition: box-shadow .15s, background .15s;
  }
    .todo-dayline .todo-day-input::placeholder{
    color: var(--muted);
    font-weight: 500;
  }
  .todo-dayline .todo-day-input:focus{
    background: #fff;
    box-shadow: 0 0 0 3px rgba(79,156,125,0.18);
  }
    .todo-day-done{
    color: var(--primary-d);
    white-space: nowrap;
  }
  /* ---------- Day 行可点击提示 ---------- */
  .todo-dayline{ cursor: pointer; }
  .todo-dayline .todo-day-input{ cursor: text; }

  /* ---------- 背景水印层 ---------- */
        .watermark-layer{
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 20vh 5vw 0 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s ease;
    overflow: hidden;
  }
  .watermark-layer.show{ opacity: 1; }

            .watermark-box{
    position: relative;
    transform: rotate(-7deg);
    transform-origin: top right;
    font-family: 'Avenir Next', 'Helvetica Neue', 'PingFang SC',
                 'Hiragino Sans GB', system-ui, sans-serif;
    padding: 4px 8px;
    user-select: none;
        text-align: center;
    width: max-content;
    max-width: 86vw;
  }

  /* Day 大标题：宋体轻盈感 + 细描边 */
                    .watermark-day{
    font-size: clamp(76px, 19vw, 152px);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 0.95;
    color: rgba(224, 162, 68, 0.18);
    -webkit-text-stroke: 1.5px rgba(196, 122, 46, 0.42);
    paint-order: stroke fill;
    white-space: nowrap;
  }

  /* 完成比例：错位摆放，字距拉大，与 Day 形成不对称感 */
        .watermark-done{
    font-size: clamp(30px, 7.5vw, 56px);
    font-weight: 500;
    font-family: 'Times New Roman', 'Georgia', 'Kaiti SC', 'STKaiti', 'KaiTi', 'Songti SC', serif;
    font-style: italic;
    letter-spacing: 1px;
    line-height: 1.15;
    margin-top: 20px;
    margin-left: 0;
    color: rgba(224, 162, 68, 0.2);
    -webkit-text-stroke: 0.8px rgba(196, 122, 46, 0.32);
    paint-order: stroke fill;
    white-space: nowrap;
  }

  /* =========================================================
     计时器网格
     ========================================================= */
  .timers{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 10px;
  }

  .empty{
    padding: 32px 16px;
    text-align: center;
    font-size: 13px;
    line-height: 1.9;
    color: var(--muted);
    background: #fff;
    border: 1px dashed var(--line-2);
    border-radius: 14px;
  }

  /* ---------- 计时器卡片 ---------- */
  .card{
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 11px 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    transition: box-shadow .2s, border-color .2s, background .2s;
  }

  .card.running{
    border-color: rgba(79,156,125,0.45);
    box-shadow: 0 2px 12px rgba(79,156,125,0.14);
  }

  .card.finished{
    animation: flash 1.2s ease-in-out infinite;
  }
  @keyframes flash{
    0%, 100%{ background: #fff; border-color: var(--line); }
    50%     { background: #fdf4f2; border-color: rgba(212,154,154,0.55); }
  }

  .card-head{ display: flex; align-items: center; gap: 4px; }

  .name-wrap{ display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }

  .name{
    font-size: 12.5px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 5px;
    cursor: text;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background .15s;
  }
  .name:hover{ background: #eef5f1; }

  .name-input{
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    width: 100%;
    min-width: 0;
    padding: 1px 5px;
    border: 1px solid var(--primary);
    border-radius: 5px;
    background: var(--primary-l);
    outline: none;
  }

  .tag{
    flex-shrink: 0;
    font-size: 9.5px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--mint-l);
    color: var(--mint-d);
    white-space: nowrap;
  }
  .tag.down{ background: var(--lilac-l); color: #4d7a63; }

  .icon-btn{
    flex-shrink: 0;
    width: 20px; height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-size: 11px;
    line-height: 1;
    color: var(--muted);
    background: transparent;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover{ background: var(--rose-l); color: #b06060; }

  .time{
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 1px;
    text-align: center;
    color: var(--ink);
    padding: 7px 2px;
    background: #f4f9f6;
    border-radius: 9px;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  .card-foot{ display: flex; gap: 5px; margin-top: 2px; }
  .card-foot .btn{
    flex: 1;
    padding: 6px 0;
    font-size: 12px;
    border-radius: 8px;
  }
    /* =========================================================
     计时历史
     ========================================================= */
  .timer-history-section {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px dashed var(--line-2);
  }
  .timer-history-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 10px;
  }
    .timer-history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .timer-history-head .timer-history-title {
    margin-bottom: 0;
  }
  .sun-history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .sun-history-head .sun-history-title {
    margin-bottom: 0;
  }
  .timer-history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
    .timer-history-headrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .timer-history-edit-btn {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    background: #eef5f1;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    color: var(--ink-2);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .timer-history-edit-btn:hover {
    background: var(--primary-l);
    color: var(--primary-d);
  }
    .timer-history-del-btn {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    background: var(--rose-l);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    color: #b06060;
    cursor: pointer;
    transition: background .15s, color .15s;
    margin-left: 4px;
  }
  .timer-history-del-btn:hover {
    background: #f2dcdc;
    color: #a05050;
  }
  .timer-history-note {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    margin: 2px 0 4px;
  }
  .te-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
    max-height: 50vh;
    overflow-y: auto;
  }
    .te-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .te-name {
    flex: 1 1 100%;
    min-width: 0;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: #f8fbf9;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    outline: none;
  }
  .te-hours {
    flex: 1;
    min-width: 60px;
    padding: 7px 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    text-align: center;
    background: #f8fbf9;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .te-hours::-webkit-outer-spin-button,
  .te-hours::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .te-hours:focus {
    border-color: var(--primary);
    background: #fff;
  }
  .te-unit {
    font-size: 12px;
    color: var(--muted);
  }
  .te-del {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line-2);
    border-radius: 50%;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .te-del:hover {
    background: var(--rose-l);
    color: #b06060;
    border-color: var(--rose);
  }
  .timer-history-item {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: var(--shadow-sm);
  }
    .timer-history-date {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary-d);
    flex: 1;
    min-width: 0;
    word-break: break-word;
    margin-bottom: 0;
  }
  .timer-history-scores {
    font-size: 12px;
    color: var(--ink-2);
    line-height: 1.7;
    word-break: break-word;
  }
  .timer-history-scores .th-sep {
    color: var(--line-2);
    margin: 0 6px;
  }
  .timer-history-scores .th-name {
    color: var(--muted);
  }
  .timer-history-scores .th-value {
    color: var(--primary-d);
    font-weight: 600;
    margin-left: 2px;
  }
  .timer-history-empty {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 12px 0;
  }

  /* =========================================================
     录音区
     ========================================================= */
  .rec-box{
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 15px 17px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
  }

  .rec-btn{
    position: relative;
    flex-shrink: 0;
    width: 58px; height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--primary);
    border: none;
    border-radius: 50%;
    box-shadow: 0 3px 12px rgba(79,156,125,0.32);
    cursor: pointer;
    transition: transform .1s, box-shadow .18s, background .18s;
    touch-action: manipulation;
  }
  .rec-btn:hover{ box-shadow: 0 4px 16px rgba(79,156,125,0.42); }
  .rec-btn:active{ transform: scale(.96); }
  .rec-btn:disabled{ opacity: .55; cursor: not-allowed; }

  .rec-icon{
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 50%;
    transition: border-radius .18s, width .18s, height .18s;
  }

  .rec-btn.recording{
    background: #d98c8c;
    box-shadow: 0 3px 12px rgba(217,140,140,0.4);
    animation: recPulse 1.3s ease-in-out infinite;
  }
  .rec-btn.recording .rec-icon{
    border-radius: 4px;
    width: 16px; height: 16px;
  }
  @keyframes recPulse{
    0%, 100%{ box-shadow: 0 3px 12px rgba(217,140,140,0.4); }
    50%     { box-shadow: 0 3px 12px rgba(217,140,140,0.4), 0 0 0 8px rgba(217,140,140,0.14); }
  }

  .rec-info{ flex: 1; min-width: 0; }
  .rec-status{
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rec-time{
    font-size: 25px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1.5px;
    color: var(--ink);
  }

  /* ---------- 日期卡片 ---------- */
  .days{ display: flex; flex-direction: column; gap: 8px; }

  .day{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 13px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: box-shadow .18s;
  }
  .day.open{ box-shadow: var(--shadow); }

  .day-head{ display: flex; align-items: center; gap: 6px; padding: 10px 13px; }

  .day-date{
    flex: 1; min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .day-meta{
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
  }

  .day-actions{ display: flex; gap: 5px; }

  .day-actions .icon-btn{
    width: 26px; height: 26px;
    font-size: 12px;
    background: #eef5f1;
    border-radius: 8px;
    color: var(--ink-2);
    transition: background .15s, color .15s;
  }
  .day-actions .icon-btn:hover{ background: var(--primary-l); color: var(--primary-d); }
  .day-actions .icon-btn.toggle{ background: var(--sand-l); color: #8a8154; }
  .day-actions .icon-btn.toggle:hover{ background: #ece9d5; }
  .day-actions .icon-btn.delete-day{ background: var(--rose-l); color: #b06060; }
  .day-actions .icon-btn.delete-day:hover{ background: #f2dcdc; color: #a05050; }

  .day-segs{
    display: none;
    padding: 2px 10px 9px;
    border-top: 1px solid var(--line);
  }
  .day.open .day-segs{ display: block; }

  /* ---------- 录音段 ---------- */
  .seg{
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 0;
    border-bottom: 1px solid #f0f6f2;
  }
  .seg:last-child{ border-bottom: none; }

  .seg-idx{
    width: 16px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
    flex-shrink: 0;
  }

  .seg-title{
    flex: 1;
    min-width: 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    padding: 3px 6px;
    border-radius: 6px;
    cursor: text;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background .15s;
  }
  .seg-title:hover{ background: #eef5f1; }
  .seg-title:empty::before{
    content: '未命名';
    color: var(--muted);
    font-weight: 400;
  }

  .seg-title-input{
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    width: 100%;
    min-width: 0;
    padding: 2px 6px;
    border: 1px solid var(--primary);
    border-radius: 6px;
    background: var(--primary-l);
    outline: none;
  }

  .seg-dur{
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding-right: 2px;
  }

  .sbtn{
    flex-shrink: 0;
    width: 25px; height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-2);
    background: #eef5f1;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, color .15s, transform .08s;
  }

<!-- 背景水印层（点击事项 Day 行切换） -->
<div class="watermark-layer" id="watermarkLayer" aria-hidden="true">
  <div class="watermark-box">
    <div class="watermark-day" id="watermarkDay">Day —</div>
    <div class="watermark-done" id="watermarkDone">完成 0 / 0</div>
  </div>
</div>

<div class="wrap">

  <!-- 顶部：日期 + 时钟 -->
  <header class="hero">
    <div class="date" id="date">——</div>
    <div class="clock" id="clock">00:00:00</div>
  </header>

  <!-- Tab 切换 -->
    <nav class="tabs">
    <button data-tab="timer" class="active">计时器</button>
    <button data-tab="rec">录音</button>
    <button data-tab="todo">事项</button>
    <button data-tab="sun">心情记</button>
  </nav>

  <!-- ================= 计时器面板 ================= -->
  <section class="panel" id="panel-timer">
    <div class="bar">
      <div class="count" id="count"></div>
      <button class="btn primary sm" id="addBtn">＋ 新建</button>
    </div>
        <div class="timers" id="timers"></div>
    <div class="empty" id="empty">
      还没有计时器<br>点「＋ 新建」开始吧
    </div>

        <div class="timer-history-section">
      <div class="timer-history-head">
        <div class="timer-history-title">📖 计时历史</div>
        <button type="button" class="sun-btn" id="archiveTimerBtn" style="font-size:12px; padding:4px 12px;">📦 存档今日</button>
      </div>
      <div id="timerHistoryList" class="timer-history-list"></div>
    </div>
  </section>

  <!-- ================= 录音面板 ================= -->
  <section class="panel hidden" id="panel-rec">

    <div class="rec-box">
      <button class="rec-btn" id="recBtn" aria-label="录音">
        <span class="rec-icon"></span>
      </button>
      <div class="rec-info">
        <div class="rec-status" id="recStatus">点击开始录音</div>
        <div class="rec-time" id="recTime">00:00</div>
      </div>
    </div>

    <div class="bar">
      <div class="count" id="recCount"></div>
      <button class="btn sm" id="playAllBtn">▶ 播放全部</button>
    </div>

    <div class="days" id="days"></div>
    <div class="empty" id="recEmpty">
      还没有录音<br>点击上方按钮开始
    </div>
  </section>

  <!-- ================= 事项面板 ================= -->
  <section class="panel hidden" id="panel-todo">

    <div class="todo-add">
      <input type="text" id="todoInput" maxlength="40" placeholder="添加今日事项…">
      <button class="btn primary" id="todoAddBtn">添加</button>
    </div>

    <div class="bar">
      <div class="todo-dayline">
        <span class="todo-day-label">Day</span>
        <input type="text" class="todo-day-input" id="todoDayInput" maxlength="6" placeholder="—" inputmode="numeric">
        <span class="todo-day-done" id="todoCount"></span>
      </div>
      <button class="btn sm" id="todoClear">清空</button>
    </div>

    <div class="todos" id="todos"></div>
    <div class="empty" id="todoEmpty">
      今天还没有事项<br>在上方输入框添加吧
    </div>
  </section>
  
  <!-- ================= 种太阳面板 ================= -->
  <section class="panel hidden" id="panel-sun">
                <div class="sun-heart-line">
      <span class="sun-heart-range">−5 ~ +5</span>
    </div>

    <div class="sun-canvas-container">
      <canvas id="moodCanvas" width="560" height="420"></canvas>
      <div class="sun-control-bar">
        <div class="sun-mood-badge" id="moodValueDisplay">0</div>
        <div class="sun-slider-container">
          <input type="range" id="moodSlider" class="sun-mood-slider" min="-5" max="5" step="1" value="0">
        </div>
        <div class="sun-action-buttons">
          <button id="moodMinusBtn" class="sun-icon-btn">−</button>
          <button id="moodResetBtn" class="sun-icon-btn">↺</button>
          <button id="moodPlusBtn" class="sun-icon-btn">+</button>
        </div>
      </div>
    </div>

    <div class="sun-notes-row">
      <div class="sun-note-col">
        <h4>🍀 小确幸</h4>
        <textarea id="happyNote" class="sun-note-textarea" rows="4" placeholder="开心的事..."></textarea>
        <div class="sun-note-toolbar">
          <button class="sun-btn clearNoteBtn" data-target="happy">🗑️ 清空</button>
        </div>
        <div class="sun-presets-header">
          <span>📌 快捷预设</span>
          <button id="resetHappyPresetsBtn" class="sun-reset-preset-btn">↺ 恢复默认</button>
        </div>
        <div id="happyPresets" class="sun-note-presets"></div>
        <div class="sun-custom-preset-area">
          <input type="text" id="happyCustomInput" placeholder="自定义小确幸...">
          <button id="addHappyToNoteBtn" class="sun-btn">➕ 添加</button>
          <button id="addHappyPresetBtn" class="sun-btn">📌 添加预设</button>
        </div>
      </div>

      <div class="sun-note-col">
        <h4>🗑️ 垃圾桶</h4>
        <textarea id="sadNote" class="sun-note-textarea" rows="4" placeholder="不开心的事..."></textarea>
        <div class="sun-note-toolbar">
          <button class="sun-btn clearNoteBtn" data-target="sad">🗑️ 清空</button>
        </div>
        <div class="sun-presets-header">
          <span>📌 快捷预设</span>
          <button id="resetSadPresetsBtn" class="sun-reset-preset-btn">↺ 恢复默认</button>
        </div>
        <div id="sadPresets" class="sun-note-presets"></div>
        <div class="sun-custom-preset-area">
          <input type="text" id="sadCustomInput" placeholder="自定义下雨事...">
          <button id="addSadToNoteBtn" class="sun-btn">➕ 添加</button>
          <button id="addSadPresetBtn" class="sun-btn">📌 添加预设</button>
        </div>
      </div>
    </div>
        <!-- 心情历史记录 -->
        <div class="sun-history-section">
      <div class="sun-history-head">
        <div class="sun-history-title">📖 心情历史</div>
        <button type="button" class="sun-btn" id="archiveSunBtn" style="font-size:12px; padding:4px 12px;">📦 存档今日</button>
      </div>
      <div id="sunHistoryList" class="sun-history-list"></div>
    </div>
  </section>

</div>

  <!-- 数据备份条 -->
<div class="backup-bar">
  <div class="backup-hint">💡 定期备份，防数据丢失</div>
  <div class="backup-btns">
    <button type="button" class="sun-btn" id="exportDataBtn">📦 备份数据</button>
    <button type="button" class="sun-btn" id="importDataBtn">📥 恢复数据</button>
    <input type="file" id="importDataFile" accept="application/json,.json" style="display:none;">
  </div>
</div>

<!-- 底部播放条 -->
<div class="player hidden" id="player">
  <div class="player-info">
    <div class="player-title" id="pTitle">—</div>
    <div class="player-sub" id="pSub">—</div>
  </div>
  <div class="player-ctrl">
    <button class="pbtn" id="pPrev" title="上一段">⏮</button>
    <button class="pbtn play" id="pPlay" title="播放/暂停">▶</button>
    <button class="pbtn" id="pNext" title="下一段">⏭</button>
    <button class="pbtn loop" id="pLoop" title="循环模式">➡</button>
    <button class="pbtn close" id="pClose" title="关闭">✕</button>
  </div>
</div>

<!-- 新建计时器弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <h2>新建计时器</h2>

    <div class="field">
      <label>名称</label>
      <input type="text" id="mName" maxlength="24" placeholder="例如：煮鸡蛋">
    </div>

    <div class="field">
      <label>类型</label>
      <div class="seg-toggle" id="segToggle">
        <button type="button" data-mode="up" class="active">正计时</button>
        <button type="button" data-mode="down">倒计时</button>
      </div>
    </div>

    <div class="field hidden" id="downRow">
      <label>倒计时时长</label>
      <div class="dur">
        <input type="number" id="mH" min="0" max="99" value="0"><span>时</span>
        <input type="number" id="mM" min="0" max="59" value="5"><span>分</span>
        <input type="number" id="mS" min="0" max="59" value="0"><span>秒</span>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mOk">创建</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     0. 通用工具
     ========================================================= */
  const $ = (sel) => document.querySelector(sel);
  const pad = (n) => String(n).padStart(2, '0');

  function uid() {
    return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function fmtMs(ms) {
    if (!isFinite(ms) || ms < 0) ms = 0;
    const t = Math.floor(ms / 1000);
    return pad(Math.floor(t / 3600)) + ':' + pad(Math.floor((t % 3600) / 60)) + ':' + pad(t % 60);
  }

  function fmtDur(ms) {
    if (!isFinite(ms) || ms < 0) ms = 0;
    const t = Math.floor(ms / 1000);
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;
    return h > 0 ? (h + ':' + pad(m) + ':' + pad(s)) : (pad(m) + ':' + pad(s));
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function defaultTitle() {
    const d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /* ---------- 轻提示 ---------- */
  let toastTimer = null;
  function showToast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  /* ---------- 自定义确认框（替代被沙箱禁用的 confirm） ---------- */
  function confirmDialog(msg) {
    return new Promise((resolve) => {
      const mk = document.createElement('div');
      mk.className = 'confirm-mask';

      const box = document.createElement('div');
      box.className = 'confirm-box';

      const p = document.createElement('p');
      p.textContent = msg;

      const btns = document.createElement('div');
      btns.className = 'confirm-btns';

      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'btn';
      cancelBtn.textContent = '取消';

      const okBtn = document.createElement('button');
      okBtn.type = 'button';
      okBtn.className = 'btn primary';
      okBtn.textContent = '确定';

      btns.append(cancelBtn, okBtn);
      box.append(p, btns);
      mk.appendChild(box);
      document.body.appendChild(mk);

      requestAnimationFrame(() => mk.classList.add('show'));

      let closed = false;
      function close(result) {
        if (closed) return;
        closed = true;
        mk.classList.remove('show');
        setTimeout(() => mk.remove(), 220);
        resolve(result);
      }

      cancelBtn.addEventListener('click', () => close(false));
      okBtn.addEventListener('click', () => close(true));
      mk.addEventListener('click', (e) => { if (e.target === mk) close(false); });

      const onKey = (e) => {
        if (e.key === 'Escape') { document.removeEventListener('keydown', onKey); close(false); }
        if (e.key === 'Enter')  { document.removeEventListener('keydown', onKey); close(true);  }
      };
      document.addEventListener('keydown', onKey);

      setTimeout(() => okBtn.focus(), 80);
    });
  }

  /* =========================================================
     1. 顶部日期（含年份）+ 时钟
     ========================================================= */
  const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const dateEl = $('#date'), clockEl = $('#clock');

  let lastDayStr = todayStr();

  function updateClock() {
    const d = new Date();
    dateEl.textContent =
      d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEK[d.getDay()];
    clockEl.textContent =
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());

        const cur = todayStr();
    if (cur !== lastDayStr) {
      lastDayStr = cur;
    }
  }
  updateClock();
  setInterval(updateClock, 200);

  /* =========================================================
     2. Tab 切换
     ========================================================= */
    document.querySelectorAll('.tabs button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.panel').forEach((p) => p.classList.add('hidden'));
      $('#panel-' + btn.dataset.tab).classList.remove('hidden');

            // 切到种太阳时，重新渲染一次，确保画布正确绘制
      if (btn.dataset.tab === 'sun') {
        renderSunPanel();
      }
      // 切到计时器时，刷新历史记录
      if (btn.dataset.tab === 'timer') {
        renderTimerHistory();
      }
    });
  });

  /* =========================================================
     3. 计时器
     ========================================================= */
    const T_KEY = 'my-timers-v2';
    const TH_KEY = 'my-timer-history-v1';
  let timerHistory = {};
    const timers = [];
    const cards = new Map();

        function saveTimers() {
    try {
      localStorage.setItem(T_KEY, JSON.stringify({
        savedAt: Date.now(),
        list: timers.map((t) => ({
          id: t.id,
          name: t.name,
          mode: t.mode,
          duration: t.duration,
          accumulated: t.accumulated + (t.running ? Date.now() - t.startedAt : 0),
          running: !!t.running,
          finished: false
        }))
      }));
    } catch (e) {}
    try { snapshotTimerHistory(); } catch (e) {}

    // 当前在计时器页 → 立刻刷新历史区（今日会跟随上方变化）
    try {
      const activeTab = document.querySelector('.tabs button.active');
      if (activeTab && activeTab.dataset.tab === 'timer') {
        renderTimerHistory();
      }
    } catch (e) {}
  }
      function loadTimerHistory() {
    try {
      const raw = localStorage.getItem(TH_KEY);
      timerHistory = raw ? JSON.parse(raw) : {};
      if (typeof timerHistory !== 'object' || !timerHistory) timerHistory = {};
    } catch (e) { timerHistory = {}; }

    // 兼容旧结构：{ date: { name: ms } } → { date: { items: [...] } }
    let migrated = false;
    Object.keys(timerHistory).forEach((date) => {
      const rec = timerHistory[date];
      if (!rec || typeof rec !== 'object') return;
      if (Array.isArray(rec.items)) return; // 已是新结构
      const items = [];
      Object.entries(rec).forEach(([name, ms]) => {
        const n = Number(ms) || 0;
        if (n > 0) items.push({ id: uid(), name, ms: n });
      });
      timerHistory[date] = { items, day: '', done: 0, total: 0 };
      migrated = true;
    });
    if (migrated) saveTimerHistory();
  }

  function saveTimerHistory() {
    try { localStorage.setItem(TH_KEY, JSON.stringify(timerHistory)); } catch (e) {}
  }

            function snapshotTimerHistory() {
    const today = todayStr();
    const existing = timerHistory[today];
    if (existing && existing.archived) return;

    const items = [];
    timers.forEach((t) => {
      const elapsed = t.accumulated + (t.running ? Date.now() - t.startedAt : 0);
      if (elapsed > 0) items.push({ id: t.id, name: t.name, ms: elapsed });
    });

    let dayVal = '';
    let doneCount = 0;
    let total = 0;
    try {
      dayVal = getDayVal();
      const list = todayTodos();
      total = list.length;
      doneCount = list.filter((x) => x.done).length;
    } catch (e) {}

    if (!items.length && !dayVal && total === 0) return;

    timerHistory[today] = {
      items,
      day: dayVal,
      done: doneCount,
      total: total
    };
    saveTimerHistory();
  }

    function renderTimerHistory() {
    const container = document.getElementById('timerHistoryList');
    if (!container) return;
    const dates = Object.keys(timerHistory).sort().reverse();
    if (!dates.length) {
      container.innerHTML = '<div class="timer-history-empty">还没有记录，计时后会自动保存到历史</div>';
      return;
    }
    container.innerHTML = '';

    dates.forEach((date) => {
      const rec = timerHistory[date] || {};
      const items = Array.isArray(rec.items) ? rec.items : [];
      const isToday = date === todayStr();

      const item = document.createElement('div');
      item.className = 'timer-history-item';

      /* 第一行：日期 + Day + 完成比例 + 编辑 */
      const headRow = document.createElement('div');
      headRow.className = 'timer-history-headrow';

            const dateEl = document.createElement('span');
      dateEl.className = 'timer-history-date';
      let headText = isToday ? ('今天 · ' + date) : date;
            if (rec.day && rec.day.trim() !== '') {
        const dayVal = rec.day.trim().toLowerCase();
        if (dayVal === 'off') {
          headText += ' · Day off';
        } else {
          headText += ' · Day ' + rec.day;
        }
      }
      if (rec.total > 0) headText += ' -完成 ' + (rec.done || 0) + ' / ' + rec.total;
      try {
        if (sunHistory && sunHistory[date] && sunHistory[date].mood !== undefined && sunHistory[date].mood !== 0) {
          headText += ' · 心情 ' + sunHistory[date].mood;
        }
      } catch (e) {}
      dateEl.textContent = headText;
      headRow.appendChild(dateEl);

            const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'timer-history-edit-btn';
      editBtn.textContent = '✏️';
      editBtn.title = '编辑此日记录';
      editBtn.onclick = (e) => {
        e.stopPropagation();
        showTimerHistoryEditDialog(date, rec);
      };
      headRow.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'timer-history-del-btn';
      delBtn.textContent = '🗑';
      delBtn.title = '删除此日记录';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteTimerHistoryDate(date);
      };
      headRow.appendChild(delBtn);

      item.appendChild(headRow);

      if (rec.note) {
        const noteEl = document.createElement('div');
        noteEl.className = 'timer-history-note';
        noteEl.textContent = '📝 ' + rec.note;
        item.appendChild(noteEl);
      }

      /* 第二行：项目 */
      const validItems = items.filter((x) => x && x.ms > 0);
      if (validItems.length) {
        const scoresEl = document.createElement('div');
        scoresEl.className = 'timer-history-scores';

        validItems.forEach((it, idx) => {
          if (idx > 0) {
            const sep = document.createElement('span');
            sep.className = 'th-sep';
            sep.textContent = '|';
            scoresEl.appendChild(sep);
          }
          const nameEl = document.createElement('span');
          nameEl.className = 'th-name';
          nameEl.textContent = it.name;
          scoresEl.appendChild(nameEl);

          const valEl = document.createElement('span');
          valEl.className = 'th-value';
          valEl.textContent = (it.ms / 3600000).toFixed(1) + 'h';
          scoresEl.appendChild(valEl);
        });

        item.appendChild(scoresEl);
      }

      container.appendChild(item);
    });
  }
      async function deleteTimerHistoryDate(date) {
    const ok = await confirmDialog('删除 ' + date + ' 的计时历史？此操作不可撤销。');
    if (!ok) return;

    delete timerHistory[date];
    saveTimerHistory();
    renderTimerHistory();

    // 如果删的是今天，之后再有任何上方变化，就会重新写入今天的历史
    showToast('已删除 ' + date + ' 的记录');
  }

    function showTimerHistoryEditDialog(date, rec) {
    if (!rec.items) rec.items = [];
    const workingItems = rec.items.map((x) => ({ ...x }));

    const mk = document.createElement('div');
    mk.className = 'confirm-mask';

    const box = document.createElement('div');
    box.className = 'confirm-box';
    box.style.maxWidth = '380px';
    box.style.textAlign = 'left';
    box.style.padding = '20px 18px 16px';

        const title = document.createElement('h3');
    title.textContent = '✏️ 编辑 ' + date;
    title.style.cssText = 'margin:0 0 12px; font-size:15px; color:var(--ink); text-align:center;';
    box.appendChild(title);

    const noteLabel = document.createElement('label');
    noteLabel.textContent = '备注';
    noteLabel.style.cssText = 'display:block; font-size:12px; color:var(--muted); margin:0 0 4px;';
    box.appendChild(noteLabel);

    const noteInput = document.createElement('input');
    noteInput.type = 'text';
    noteInput.maxLength = 40;
    noteInput.value = rec.note || '';
    noteInput.placeholder = '可选';
    noteInput.style.cssText = 'width:100%; padding:8px 10px; border:1px solid var(--line-2); border-radius:8px; font-family:inherit; font-size:13px; color:var(--ink); background:#f8fbf9; outline:none; margin-bottom:12px;';
    box.appendChild(noteInput);

    const sep = document.createElement('div');
    sep.style.cssText = 'font-size:12px; color:var(--muted); margin-bottom:6px;';
    sep.textContent = '计时项';
    box.appendChild(sep);

    const list = document.createElement('div');
    list.className = 'te-list';
    box.appendChild(list);

    function renderRows() {
      list.innerHTML = '';
      workingItems.forEach((it, idx) => {
        const row = document.createElement('div');
        row.className = 'te-row';

        const nameInp = document.createElement('input');
        nameInp.type = 'text';
        nameInp.className = 'te-name';
        nameInp.value = it.name || '';
        nameInp.maxLength = 24;
        nameInp.placeholder = '项目名称';
        nameInp.addEventListener('input', () => { it.name = nameInp.value; });
        row.appendChild(nameInp);

        const msInp = document.createElement('input');
        msInp.type = 'number';
        msInp.className = 'te-hours';
        msInp.min = '0';
        msInp.step = '0.1';
        msInp.value = ((it.ms || 0) / 3600000).toFixed(1);
        msInp.addEventListener('input', () => {
          const v = parseFloat(msInp.value);
          it.ms = (isFinite(v) && v >= 0) ? Math.round(v * 3600000) : 0;
        });
        row.appendChild(msInp);

        const unit = document.createElement('span');
        unit.className = 'te-unit';
        unit.textContent = 'h';
        row.appendChild(unit);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';

  function loadTimers() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(T_KEY) || 'null'); } catch (e) {}

    let list = [];
    let savedAt = Date.now();
    if (Array.isArray(data)) {
      list = data;
    } else if (data && Array.isArray(data.list)) {
      list = data.list;
      savedAt = Number(data.savedAt) || Date.now();
    } else {
      // 兼容旧 key
      try {
        const old = JSON.parse(localStorage.getItem('my-timers-v1') || '[]');
        if (Array.isArray(old)) list = old;
      } catch (e) {}
    }

    const gap = Math.max(0, Date.now() - savedAt);

    list.forEach((d) => {
      const wasRunning = !!d.running;
      let acc = Number(d.accumulated) || 0;
      // 关闭前正在跑的，把关闭期间流逝的时间补上
      if (wasRunning) acc += gap;

      timers.push({
        id: d.id || uid(),
        name: d.name || '计时器',
        mode: d.mode === 'down' ? 'down' : 'up',
        duration: Number(d.duration) || 0,
        accumulated: acc,
        running: wasRunning,
        startedAt: wasRunning ? Date.now() : null,
        finished: false
      });
    });
  }

  function toggleTimer(t) {

  let lastTSave = 0;
  setInterval(() => {
    const now = Date.now();
    const done = [];
    for (const t of timers) {
      const c = cards.get(t.id);
      if (!c) continue;
      const elapsed = t.accumulated + (t.running ? now - t.startedAt : 0);
      let text;
      if (t.mode === 'down') {
        const remain = Math.max(0, t.duration - elapsed);
        text = fmtMs(remain);
        if (remain <= 0 && t.running) done.push(t);
      } else {
        text = fmtMs(elapsed);
      }
      if (c.timeEl.textContent !== text) c.timeEl.textContent = text;
    }
    done.forEach(finishTimer);
    if (now - lastTSave > 1000 && timers.some((t) => t.running)) { lastTSave = now; saveTimers(); }
  }, 100);

  let audioCtx = null;

  function ensureAudioCtx() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function beep() {
    try {
      ensureAudioCtx();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      for (let i = 0; i < 3; i++) {
        const t0 = now + i * 0.34;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        osc.connect(gain); gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.26, t0 + 0.02);
        gain.gain.linearRampToValueAtTime(0, t0 + 0.24);
        osc.start(t0); osc.stop(t0 + 0.28);
      }
    } catch (e) {}
  }

  /* =========================================================
     5. 录音数据层 · IndexedDB
     ========================================================= */
  const DB_NAME = 'doodle-rec';
  const STORE = 'days';
  let dbPromise = null;

  function getDB() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error('浏览器不支持 IndexedDB')); return; }
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE)) {
            db.createObjectStore(STORE, { keyPath: 'date' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbPromise;
  }

  async function dbGetAll() {
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbPut(day) {
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(day);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbDelete(date) {
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(date);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  let mediaRecorder = null;

  const recBtn = $('#recBtn'), recStatus = $('#recStatus'), recTime = $('#recTime');

  function setRecUI(recording) {
    recBtn.classList.toggle('recording', recording);
    if (recording) {
      recStatus.textContent = pending
        ? (pending.type === 'replace' ? '重录中…点击停止' : '补录中…点击停止')

  recBtn.addEventListener('click', async () => {

      return;

  async function beginRecord(pendingInfo) {
    if (mediaRecorder && mediaRecorder.state === 'recording') return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast('当前环境不支持录音，请使用 HTTPS 打开');
      return;
    }
    if (typeof MediaRecorder === 'undefined') {
      showToast('当前浏览器不支持录音功能');
      return;
    }

    pending = pendingInfo || null;

    recBtn.disabled = true;
    recStatus.textContent = '正在请求麦克风权限…';

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      recBtn.disabled = false;
      pending = null;
      setRecUI(false);
      let msg = '无法访问麦克风';
      if (err && err.name === 'NotAllowedError')       msg = '麦克风权限被拒绝，请在浏览器中允许';
      else if (err && err.name === 'NotFoundError')    msg = '未检测到麦克风设备';
      else if (err && err.name === 'NotReadableError') msg = '麦克风被其他程序占用';
      else if (err && err.name === 'SecurityError')    msg = '安全限制：请使用 HTTPS 打开';
      else if (err && err.message)                     msg = '无法访问麦克风：' + err.message;
      showToast(msg);
      return;
    }

    recBtn.disabled = false;
    recChunks = [];

    let opts = {};
    try {
      if (MediaRecorder.isTypeSupported) {
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) opts.mimeType = 'audio/webm;codecs=opus';
        else if (MediaRecorder.isTypeSupported('audio/webm'))        opts.mimeType = 'audio/webm';
        else if (MediaRecorder.isTypeSupported('audio/mp4'))         opts.mimeType = 'audio/mp4';
      }
    } catch (e) {}

    try {
      mediaRecorder = new MediaRecorder(stream, opts);
    } catch (e) {
      try { mediaRecorder = new MediaRecorder(stream); }
      catch (e2) {
        stream.getTracks().forEach((t) => t.stop());
        mediaRecorder = null;
        pending = null;
        setRecUI(false);
        showToast('初始化录音失败');
        return;
      }
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size) recChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(recTimerId);
      const dur = Date.now() - recStartTime;

      if (recChunks.length && dur > 300) {
        const type = (recChunks[0] && recChunks[0].type) || 'audio/webm';
        const blob = new Blob(recChunks, { type });
        try {
          await saveRecording(blob, dur);
        } catch (e) {
          showToast('保存录音失败');
        }
      }
      pending = null;
      mediaRecorder = null;
      setRecUI(false);
    };

    mediaRecorder.onerror = () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(recTimerId);
      pending = null;
      mediaRecorder = null;
      setRecUI(false);
      showToast('录音出错，请重试');
    };

    try {
      mediaRecorder.start(1000);
    } catch (e) {
      stream.getTracks().forEach((t) => t.stop());
      mediaRecorder = null;
      pending = null;
      setRecUI(false);
      showToast('无法开始录音');
      return;
    }

    recStartTime = Date.now();
    recTime.textContent = '00:00';
    recTimerId = setInterval(() => {
      recTime.textContent = fmtDur(Date.now() - recStartTime);
    }, 200);
    setRecUI(true);
  }

  async function saveRecording(blob, duration) {
    const targetDate = pending ? pending.date : todayStr();

    let day = days.find((d) => d.date === targetDate);
    if (!day) {
      day = { date: targetDate, segments: [] };
      days.push(day);
    }

    if (pending && pending.type === 'replace') {
      const old = day.segments[pending.idx];
      if (old) {
        day.segments[pending.idx] = {
          id: old.id,
          title: old.title || defaultTitle(),
          blob, duration,
          createdAt: Date.now()
        };
      }
    } else if (pending && pending.type === 'insert') {
      day.segments.splice(pending.idx + 1, 0, {
        id: uid(),
        title: defaultTitle(),
        blob, duration,
        createdAt: Date.now()
      });
    } else {
      day.segments.push({
        id: uid(),
        title: defaultTitle(),
        blob, duration,
        createdAt: Date.now()
      });
    }

    await dbPut(day);
    days.sort((a, b) => b.date.localeCompare(a.date));
    if (pending) openDays.add(day.date);
    renderDays();
  }

  const audioEl = new Audio();

  let playerList = [];
  let playerPos = 0;
  let playerLoop = 'off';

  let currentUrl = null;

  const playerEl = $('#player'), pTitle = $('#pTitle'), pSub = $('#pSub');
  const pPlay = $('#pPlay'), pLoop = $('#pLoop');

  function buildListForDay(date) {
    const day = days.find((d) => d.date === date);
    if (!day) return [];
    return day.segments.map((s, i) => ({ date, idx: i, blob: s.blob, title: segTitle(s, i) }));
  }

  function buildListAll() {
    const out = [];
    [...days].sort((a, b) => a.date.localeCompare(b.date)).forEach((d) => {
      d.segments.forEach((s, i) => out.push({ date: d.date, idx: i, blob: s.blob, title: segTitle(s, i) }));
    });
    return out;
  }

  function startPlay(scope, date, startIdx) {
    ensureAudioCtx();
    playerScope = scope;
    playerList = scope === 'day' ? buildListForDay(date) : buildListAll();
    if (!playerList.length) return;
    playAt(startIdx || 0);
  }

  function playAt(pos) {
    if (!playerList.length) return;

    if (pos < 0) pos = 0;
    if (pos >= playerList.length) {
      if (playerLoop !== 'off') pos = 0;
      else { stopPlay(); return; }
    }

    playerPos = pos;
    const item = playerList[pos];

    if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
    currentUrl = URL.createObjectURL(item.blob);
    audioEl.src = currentUrl;

    const p = audioEl.play();
    if (p && p.catch) p.catch(() => {});

    updatePlayer();
  }

  function stopPlay() {
    try { audioEl.pause(); } catch (e) {}
    audioEl.removeAttribute('src');
    if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
    playerList = [];
    playerPos = 0;
    playerEl.classList.add('hidden');
  }

  audioEl.addEventListener('ended', () => {
    const next = playerPos + 1;

    if (next < playerList.length) { playAt(next); return; }
    if (playerLoop === 'off')     { stopPlay(); return; }
    if (playerLoop === 'single')  { playAt(0); return; }
    if (playerScope === 'all')    { playAt(0); return; }

    const idx = days.findIndex((d) => d.date === playerList[playerPos].date);
    for (let i = idx + 1; i < days.length; i++) {
      if (days[i].segments.length) { startPlay('day', days[i].date, 0); return; }
    }
    for (let i = 0; i < days.length; i++) {
      if (days[i].segments.length) { startPlay('day', days[i].date, 0); return; }
    }
    stopPlay();
  });

  audioEl.addEventListener('play', updatePlayer);
  audioEl.addEventListener('pause', updatePlayer);

  function updatePlayer() {
    if (!playerList.length) { playerEl.classList.add('hidden'); return; }
    playerEl.classList.remove('hidden');

    const cur = playerList[playerPos];
    if (!cur) return;

    const day = days.find((d) => d.date === cur.date);
    const seg = day && day.segments[cur.idx];
    const title = seg ? segTitle(seg, cur.idx) : (cur.title || '未命名');

    const isToday = cur.date === todayStr();

    pTitle.textContent =
      (isToday ? '今天 · ' + cur.date : cur.date) + ' · ' + title;
    pSub.textContent =
      '第 ' + (cur.idx + 1) + '/' + (day ? day.segments.length : 1) + ' 段 · ' +
      '共 ' + playerList.length + ' 段 · ' +
      (playerLoop === 'off' ? '不循环' :
       playerLoop === 'single' ? '单曲循环' : '列表循环');

    pPlay.textContent = audioEl.paused ? '▶' : '⏸';

    if (playerLoop === 'off')         { pLoop.textContent = '➡'; pLoop.title = '不循环（点击切换）'; }
    else if (playerLoop === 'single') { pLoop.textContent = '🔂'; pLoop.title = '单曲循环'; }
    else                              { pLoop.textContent = '🔁'; pLoop.title = '列表循环'; }
  }

  pPlay.onclick = () => {
    if (!playerList.length) return;
    ensureAudioCtx();
    if (audioEl.paused) { const p = audioEl.play(); if (p && p.catch) p.catch(() => {}); }
    else audioEl.pause();
  };
  $('#pPrev').onclick = () => playAt(playerPos - 1);
  $('#pNext').onclick = () => playAt(playerPos + 1);
  pLoop.onclick = () => {

               : playerLoop === 'single' ? 'all' : 'off';
    updatePlayer();
  };
  $('#pClose').onclick = stopPlay;

    playerLoop = 'all';
    startPlay('all', null, 0);

      if (!Array.isArray(sunCustomSad)) sunCustomSad = [];
    } catch (e) {}
  }

    function saveSunData() {
    try {
      localStorage.setItem(SUN_KEY_MOOD, String(sunMood));
      localStorage.setItem(SUN_KEY_HAPPY, sunHappyNote);
      localStorage.setItem(SUN_KEY_SAD, sunSadNote);
      localStorage.setItem(SUN_KEY_CUSTOM_HAPPY, JSON.stringify(sunCustomHappy));
      localStorage.setItem(SUN_KEY_CUSTOM_SAD, JSON.stringify(sunCustomSad));
            localStorage.setItem(SUN_KEY_HIDDEN_HAPPY, JSON.stringify(sunHiddenHappy));
      localStorage.setItem(SUN_KEY_HIDDEN_SAD, JSON.stringify(sunHiddenSad));
      snapshotSunToday();
    } catch (e) {}
  }
    function loadSunHistory() {
    try {
      const raw = localStorage.getItem(SUN_KEY_HISTORY);
      sunHistory = raw ? JSON.parse(raw) : {};
      if (typeof sunHistory !== 'object' || !sunHistory) sunHistory = {};
    } catch (e) { sunHistory = {}; }
  }

  function saveSunHistory() {
    try {
      localStorage.setItem(SUN_KEY_HISTORY, JSON.stringify(sunHistory));
    } catch (e) {}
  }

  function escapeHtmlText(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

    function snapshotSunToday() {
    const today = todayStr();
    const existing = sunHistory[today];
    if (existing && existing.archived) return;

    const hasContent = sunMood !== 0 || sunHappyNote.trim() || sunSadNote.trim();
    if (!hasContent && !sunHistory[today]) return;
    sunHistory[today] = {
      mood: sunMood,
      happyNote: sunHappyNote,
      sadNote: sunSadNote,
      savedAt: Date.now()
    };
    saveSunHistory();
    renderSunHistory();
  }

  function renderSunHistory() {

  function sunAppendWithAutoNumber(currentText, newContent) {
    if (!newContent.trim()) return currentText;
    const lines = currentText.split(/\r?\n/).filter((l) => l.trim().length > 0);
    let maxNum = 0;
    for (const line of lines) {
      const m = line.match(/^\s*(\d+)\./);
      if (m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
    }
    const newLine = (maxNum + 1) + '. ' + newContent;
    if (currentText.trim() === '') return newLine;
    return currentText + (currentText.endsWith('\n') ? '' : '\n') + newLine;
  }

  /* ---------- 画布绘制 ---------- */
  function sunJitter(amount = 0.8) { return (Math.random() - 0.5) * amount; }

  function drawMoodCanvas(mood) {
    const canvas = document.getElementById('moodCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const width = 560, height = 420;
    canvas.width = width;
    canvas.height = height;

    function getDiagonalGradient(m) {
      const lb = "#D8E8D0";
      let rt;
      if (m >= 4) rt = "#FFF5E0";
      else if (m === 3) rt = "#FFF2DA";
      else if (m === 2) rt = "#FFEFD4";
      else if (m === 1) rt = "#FEF0D0";
      else if (m === 0) rt = "#F0EFE0";
      else if (m === -1) rt = "#E0E6D8";
      else if (m === -2) rt = "#D4DECE";
      else if (m === -3) rt = "#C8D4C4";
      else if (m === -4) rt = "#BCC8B8";
      else rt = "#B0C0AC";
      const g = ctx.createLinearGradient(0, height, width, 0);
      g.addColorStop(0, lb);
      g.addColorStop(1, rt);
      return g;
    }
    ctx.fillStyle = getDiagonalGradient(mood);
    ctx.fillRect(0, 0, width, height);

    if (mood > 0) ctx.fillStyle = 'rgba(230,200,120,' + Math.min(0.08, mood * 0.015) + ')';
    else if (mood < 0) ctx.fillStyle = 'rgba(100,110,120,' + Math.min(0.08, Math.abs(mood) * 0.016) + ')';
    else ctx.fillStyle = 'rgba(210,230,200,0.04)';
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < 70; i++) {
      ctx.beginPath();
      ctx.arc(Math.random() * width, Math.random() * height, Math.random() * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(80,70,40,0.03)';
      ctx.fill();
    }

    const SUN_BASE_X = 340, SUN_BASE_Y = 140;
    const raysCount = mood > 0 ? Math.min(5, mood) : 0;
    const radius = 32 + (mood > 0 ? Math.min(12, mood * 2.4) : 0);
    const yOffset = mood >= 0 ? -Math.min(38, mood * 7.6) : Math.min(5, Math.abs(mood) * 1);
    let sunColor;
    if (mood >= 4) sunColor = "#FFD56E";
    else if (mood >= 2) sunColor = "#FDBF4C";
    else if (mood === 1) sunColor = "#F5AD3A";
    else if (mood === 0) sunColor = "#E0A244";
    else sunColor = 'rgba(170,100,45,' + (0.5 + mood * 0.05) + ')';
    let glowAlpha;
    if (mood >= 3) glowAlpha = 0.55;
    else if (mood === 2) glowAlpha = 0.45;
    else if (mood === 1) glowAlpha = 0.35;
    else if (mood === 0) glowAlpha = 0.2;
    else if (mood === -1) glowAlpha = 0.12;
    else glowAlpha = 0;

    function drawDoodleRay(cx, cy, innerR, angle, rayLen, color, alpha) {
      const tipX = cx + (innerR + rayLen) * Math.cos(angle);
      const tipY = cy + (innerR + rayLen) * Math.sin(angle);
      const spread = 0.38;
      const leftA = angle - spread, rightA = angle + spread;
      const baseLX = cx + innerR * Math.cos(leftA), baseLY = cy + innerR * Math.sin(leftA);
      const baseRX = cx + innerR * Math.cos(rightA), baseRY = cy + innerR * Math.sin(rightA);
      ctx.beginPath();
      ctx.moveTo(baseLX + sunJitter(1), baseLY + sunJitter(1));
      const ctrlX = cx + (innerR + rayLen * 0.65) * Math.cos(angle) + sunJitter(2);
      const ctrlY = cy + (innerR + rayLen * 0.65) * Math.sin(angle) + sunJitter(2);
      ctx.quadraticCurveTo(ctrlX, ctrlY, tipX + sunJitter(1.5), tipY + sunJitter(1.5));
      ctx.lineTo(baseRX + sunJitter(1), baseRY + sunJitter(1));
      ctx.quadraticCurveTo(ctrlX, ctrlY, tipX + sunJitter(1.5), tipY + sunJitter(1.5));
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      ctx.fill();
    }

    function drawSunRays(cx, cy, innerR, cnt, rayColor, alpha, baseLen) {
      if (cnt <= 0) return;
      const startAngle = -Math.PI / 2, step = Math.PI * 2 / 5;
      for (let i = 0; i < cnt; i++) {
        const angle = startAngle + i * step;
        let extra = 0;
        if (cnt === 5) extra = 14; else if (cnt === 4) extra = 10;
        else if (cnt === 3) extra = 6; else if (cnt === 2) extra = 2;
        drawDoodleRay(cx, cy, innerR, angle, baseLen + extra, rayColor, alpha);
      }
    }

    const sunX = SUN_BASE_X, sunY = SUN_BASE_Y + yOffset;

    if (glowAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = glowAlpha * 0.55;
      for (let i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.arc(sunX + sunJitter(2), sunY + sunJitter(2), radius + 12 + sunJitter(3), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,210,110,0.2)';
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const ang = (i / 10) * Math.PI * 2;
      const rad = radius + sunJitter(1.5);
      const x = sunX + rad * Math.cos(ang), y = sunY + rad * Math.sin(ang);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    const diskGrad = ctx.createRadialGradient(sunX - 4, sunY - 4, 4, sunX, sunY, radius);
    diskGrad.addColorStop(0, '#FFF2C4');
    diskGrad.addColorStop(0.7, sunColor);
    diskGrad.addColorStop(1, '#C47A2E');
    ctx.fillStyle = diskGrad;
    ctx.fill();
    if (mood !== 0) {
      ctx.beginPath();
      ctx.arc(sunX - 5 + sunJitter(1), sunY - 5 + sunJitter(1), radius * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFBE6';
      ctx.fill();
    }
    ctx.restore();

    if (raysCount > 0 && mood > 0) {
      let rayColor = "#FFD96E";
      if (mood >= 4) rayColor = "#FFEC9E";
      else if (mood === 3) rayColor = "#FFDE7A";
      const rayAlpha = Math.min(0.82, 0.58 + mood * 0.045);
      drawSunRays(sunX, sunY, radius - 4, raysCount, rayColor, rayAlpha, 30);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawSunRays(sunX, sunY, radius - 2, raysCount, "#FFF2B0", 0.22, 34);
      ctx.restore();
    }

    if (mood === 0) {
      ctx.save();
      ctx.globalAlpha = 0.32;
      ctx.beginPath();
      ctx.arc(sunX + sunJitter(1), sunY + sunJitter(1), radius - 5, 0, Math.PI * 2);
      ctx.fillStyle = "#DDA04A";
      ctx.fill();
      ctx.restore();
    }
    if (mood < 0 && mood >= -2) {
      ctx.save(); ctx.globalAlpha = 0.22;
      ctx.beginPath();
      ctx.arc(sunX + sunJitter(2), sunY + sunJitter(2), radius - 7, 0, Math.PI * 2);
      ctx.fillStyle = "#A75F2C"; ctx.fill();
      ctx.restore();
    } else if (mood <= -3) {
      ctx.save(); ctx.globalAlpha = 0.09;
      ctx.beginPath();
      ctx.arc(sunX + sunJitter(3), sunY + sunJitter(3), radius - 9, 0, Math.PI * 2);
      ctx.fillStyle = "#6B3E1A"; ctx.fill();
      ctx.restore();
    }

    function getCloudStyle(lvl) {
      let color, opacity, extra = false;
      if (lvl >= 5) { color = "#FFFFFF"; opacity = 0.18; }
      else if (lvl === 4) { color = "#FFFFFF"; opacity = 0.24; }
      else if (lvl === 3) { color = "#FFFFFF"; opacity = 0.34; }
      else if (lvl === 2) { color = "#FFFFFF"; opacity = 0.48; }
      else if (lvl === 1) { color = "#FFFFFF"; opacity = 0.62; }
      else if (lvl === 0) { color = "#F5F6FA"; opacity = 0.88; extra = true; }
      else if (lvl === -1) { color = "#B0B6C0"; opacity = 0.94; extra = true; }
      else if (lvl === -2) { color = "#9098A5"; opacity = 0.96; extra = true; }
      else if (lvl === -3) { color = "#707885"; opacity = 0.98; extra = true; }
      else { color = "#505866"; opacity = 0.99; extra = true; }
      return { color, opacity, extra };
    }

    function getCloudDrift(lvl) {
      if (lvl <= 0) return { dx: 0, dy: 0 };
      return { dx: -Math.min(42, lvl * 2.5), dy: Math.min(24, lvl * 2.0) };
    }

    function drawDoodleCloud(x, y, w, h, color, opacity, isHeavy) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = color;
      const parts = isHeavy ? 4 : 2;
      for (let i = 0; i < parts; i++) {
        const offX = (Math.random() - 0.5) * w * 0.35;
        const offY = (Math.random() - 0.5) * h * 0.2;
        const radX = w * (0.45 + Math.random() * 0.3);
        const radY = h * (0.5 + Math.random() * 0.3);
        ctx.beginPath();
        ctx.ellipse(x + offX, y + offY, radX, radY, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(x + (Math.random() - 0.5) * w, y + (Math.random() - 0.5) * h, 1 + Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    const drift = getCloudDrift(mood);
    let dx = drift.dx, dy = drift.dy;
    if (mood < 0) { dx = Math.min(12, Math.abs(mood) * 1.2); dy = -Math.min(10, Math.abs(mood) * 1); }
    const style = getCloudStyle(mood);
    let cloudSpots = [];
    if (mood >= 5) cloudSpots = [{x:310,y:125,w:42,h:36},{x:370,y:115,w:44,h:38}];
    else if (mood === 4) cloudSpots = [{x:300,y:110,w:48,h:42},{x:360,y:100,w:50,h:44},{x:330,y:140,w:46,h:40}];
    else cloudSpots = [
      {x:300,y:110,w:56,h:48},{x:350,y:90,w:62,h:52},{x:400,y:105,w:58,h:50},
      {x:370,y:135,w:54,h:46},{x:330,y:140,w:52,h:44},{x:420,y:75,w:50,h:42},
      {x:270,y:125,w:52,h:46},{x:310,y:150,w:56,h:48}
    ];
    if (mood > 0 && mood < 5) cloudSpots.push({x:340,y:170,w:48,h:42},{x:380,y:165,w:46,h:40});
    else if (mood >= 5) cloudSpots.push({x:345,y:168,w:42,h:38});
    for (const s of cloudSpots) drawDoodleCloud(s.x + dx, s.y + dy, s.w, s.h, style.color, style.opacity, false);

    if ((style.extra || mood === 0) && mood < 5) {
      const extraSpots = [{x:320,y:170,w:62,h:56},{x:380,y:185,w:66,h:60},{x:430,y:160,w:58,h:52}];
      for (const s of extraSpots) drawDoodleCloud(s.x + dx * 0.8, s.y + dy * 0.9, s.w, s.h, style.color, style.opacity * 0.95, true);
    }

    if (mood <= -2) {
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = 'rgba(75,75,95,0.7)';
      ctx.beginPath(); ctx.ellipse(350 + dx*0.5, 145 + dy*0.6, 72, 66, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(400 + dx*0.5, 120 + dy*0.6, 68, 60, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    if (mood <= -4) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = 'rgba(55,55,75,0.85)';
      ctx.beginPath(); ctx.ellipse(370 + dx*0.3, 160 + dy*0.5, 80, 72, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    let rainP = null;
    if (mood === -2) rainP = { cnt:22, lw:2.4, op:0.62, len:[6,12] };
    else if (mood === -3) rainP = { cnt:30, lw:3.0, op:0.78, len:[8,16] };
    else if (mood === -4) rainP = { cnt:38, lw:3.5, op:0.86, len:[10,19] };
    else if (mood === -5) rainP = { cnt:48, lw:4.2, op:0.94, len:[12,22] };

    if (rainP) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (let i = 0; i < rainP.cnt; i++) {
        const x = 80 + Math.random() * (width - 160);
        const y = 60 + Math.random() * (height - 100);
        const len = rainP.len[0] + Math.random() * (rainP.len[1] - rainP.len[0]);
        const angle = -0.3 + Math.random() * 0.6;
        const endX = x + Math.sin(angle) * len + sunJitter(2);
        const endY = y + Math.cos(angle) * len + sunJitter(2);
        ctx.beginPath();
        ctx.moveTo(x + sunJitter(1), y + sunJitter(1));
        ctx.lineTo(endX, endY);
        ctx.lineWidth = rainP.lw + (Math.random() - 0.5);
        ctx.strokeStyle = 'rgba(150,195,225,' + (rainP.op * (0.7 + Math.random() * 0.3)) + ')';
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(endX - 2, endY + 2, 1.5 + Math.random() * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(170,210,235,0.7)';
        ctx.fill();
      }
      ctx.restore();
    }

    function drawZap(x, y, height2, color) {
      ctx.save();
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#FFD98C';
      ctx.beginPath();
      const pts = [
        [x + sunJitter(2), y + sunJitter(2)],
        [x - 11 + sunJitter(3), y + height2 * 0.38 + sunJitter(3)],
        [x + 9 + sunJitter(3), y + height2 * 0.34 + sunJitter(3)],
        [x - 5 + sunJitter(3), y + height2 * 0.72 + sunJitter(3)],
        [x + 16 + sunJitter(3), y + height2 * 0.68 + sunJitter(3)],
        [x + 4 + sunJitter(2), y + height2 + sunJitter(2)]
      ];
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }
    if (mood === -4) drawZap(340, 125, 50, '#E9EE8C');
    else if (mood === -5) { drawZap(310, 95, 70, '#FFEF8F'); drawZap(400, 110, 64, '#FFE674'); }

    if (mood > 0) {
      ctx.save();
      ctx.globalAlpha = 0.7 + mood * 0.04;
      for (let i = 0; i < 18 + mood * 2; i++) {
        const bx = 20 + Math.random() * 180;
        const by = height - 20 - Math.random() * 45;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(bx + 8 + sunJitter(6), by - 12 + sunJitter(6), bx + 16 + sunJitter(8), by - 4 + sunJitter(4));
        ctx.strokeStyle = 'rgba(80,130,70,0.6)';
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bx + 3, by - 2);
        ctx.quadraticCurveTo(bx + 12, by - 18, bx + 20, by - 8);
        ctx.stroke();
      }
      for (let i = 0; i < 12 + Math.floor(mood * 1.5); i++) {
        const fx = 15 + Math.random() * 200;
        const fy = height - 30 - Math.random() * 55;
        ctx.beginPath();
        ctx.arc(fx, fy, 2 + Math.random() * 2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(250,200,120,0.8)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(fx - 1, fy - 1, 1, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,160,80,0.9)';
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(fx + 2 + sunJitter(3), fy + 6 + sunJitter(3));
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(70,120,60,0.6)';
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 18 + mood * 3; i++) {
        const x = Math.random() * width, y = Math.random() * (height * 0.7);
        ctx.beginPath();
        ctx.arc(x, y, 1 + Math.random() * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,230,140,' + (0.3 + Math.random() * 0.5) + ')';
        ctx.fill();
      }
      ctx.restore();
    }

    let sparkleCount = 12;
    if (mood >= 3) sparkleCount = 16;
    else if (mood <= -3) sparkleCount = 6;
    else if (mood === 0) sparkleCount = 8;
    for (let i = 0; i < sparkleCount; i++) {
      ctx.beginPath();
      ctx.arc(Math.random() * width, Math.random() * height, 1.2 + Math.random() * 1.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,250,210,' + (0.15 + Math.random() * 0.35) + ')';
      ctx.fill();
    }
    if (mood >= -1 && mood <= 1) {
      ctx.save();
      ctx.globalAlpha = 0.2;
      for (let i = 0; i < 4; i++) {
        const sx = 120 + i * 100;
        const sy = 80 + Math.sin(Date.now() * 0.002 + i) * 4;
        ctx.beginPath();
        ctx.moveTo(sx + sunJitter(1), sy + sunJitter(1));
        ctx.quadraticCurveTo(sx + 28 + sunJitter(4), sy - 6 + sunJitter(2), sx + 58 + sunJitter(3), sy - 2 + sunJitter(2));
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#C0D8C0';
        ctx.stroke();
      }
      ctx.restore();
    }
  }

    function renderSunPresets(containerId, defaults, customs, hiddenList, type) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';

    // 可见的默认项（过滤掉被删的）
    const visibleDefaults = defaults.filter((t) => !hiddenList.includes(t));

    // 默认项：也带编辑、删除
    visibleDefaults.forEach((text) => {
      const item = buildPresetItem(text, {
        onClick: () => applyPreset(type, text),
        onEdit: (newText) => {
          if (!newText || newText === text) return;
          hiddenList.push(text);
          customs.push(newText);
          saveSunData();
          renderSunPanel();
        },
        onDelete: () => {
          hiddenList.push(text);
          saveSunData();
          renderSunPanel();
        }
      });
      container.appendChild(item);
    });

    // 自定义项
    customs.forEach((text, idx) => {
      const item = buildPresetItem(text, {
        onClick: () => applyPreset(type, text),
        onEdit: (newText) => {
          if (!newText || newText === text) return;
          customs[idx] = newText;
          saveSunData();
          renderSunPanel();
        },
        onDelete: () => {
          customs.splice(idx, 1);
          saveSunData();
          renderSunPanel();
        }
      });
      container.appendChild(item);
    });
  }

  function buildPresetItem(text, handlers) {
    const item = document.createElement('div');
    item.className = 'sun-preset-item';

    const span = document.createElement('span');
    span.className = 'sun-preset-text';
    span.innerText = text;
    span.title = '点击添加 · 长按可编辑';

    let pressTimer = null;
    let wasLongPress = false;
    let isEditing = false;

    function beginEdit() {
      if (isEditing) return;
      isEditing = true;

      const input = document.createElement('input');
      input.className = 'sun-preset-edit-input';
      input.type = 'text';
      input.maxLength = 40;
      input.value = text;

      span.textContent = '';
      span.appendChild(input);
      input.focus();
      input.select();

      let finished = false;
      function finish(commit) {
        if (finished) return;
        finished = true;
        isEditing = false;

        const v = commit ? input.value.trim() : '';

        // 关键修复：无论是否提交，先把 span 恢复成原文字
        span.textContent = '';
        span.innerText = text;

        // 若内容真的变了，再交给上层去持久化 + 重渲染
        if (commit && v && v !== text) {
          handlers.onEdit(v);
        }
      }

      input.addEventListener('blur', () => finish(true));
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
        if (ev.key === 'Escape') { input.value = text; input.blur(); }
      });
    }

    span.addEventListener('click', () => {
      // 长按刚结束，忽略这一次点击
      if (wasLongPress) { wasLongPress = false; return; }
      if (isEditing) return;
      handlers.onClick();
    });

    // 触摸长按
    span.addEventListener('touchstart', () => {
      if (isEditing) return;
      wasLongPress = false;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        wasLongPress = true;
        beginEdit();
      }, 550);
    }, { passive: true });
    span.addEventListener('touchend', () => clearTimeout(pressTimer), { passive: true });
    span.addEventListener('touchcancel', () => clearTimeout(pressTimer), { passive: true });
    span.addEventListener('touchmove', () => clearTimeout(pressTimer), { passive: true });

    // 鼠标长按（电脑上测试用）
    span.addEventListener('mousedown', () => {
      if (isEditing) return;
      wasLongPress = false;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        wasLongPress = true;
        beginEdit();
      }, 550);
    });
    span.addEventListener('mouseup', () => clearTimeout(pressTimer));
    span.addEventListener('mouseleave', () => clearTimeout(pressTimer));

    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.innerText = '✏️';
    editBtn.className = 'sun-preset-edit';
    editBtn.onclick = (e) => { e.stopPropagation(); beginEdit(); };

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.innerText = '🗑️';
    delBtn.className = 'sun-preset-del';
    delBtn.onclick = (e) => { e.stopPropagation(); handlers.onDelete(); };

    item.appendChild(span);
    item.appendChild(editBtn);
    item.appendChild(delBtn);
    return item;
  }

  function applyPreset(type, text) {
    if (type === 'happy') {
      sunHappyNote = sunAppendWithAutoNumber(sunHappyNote, text);
      const ta = document.getElementById('happyNote');
      if (ta) ta.value = sunHappyNote;
    } else {
      sunSadNote = sunAppendWithAutoNumber(sunSadNote, text);
      const ta = document.getElementById('sadNote');
      if (ta) ta.value = sunSadNote;
    }
    saveSunData();
  }

        if (sadTA) sadTA.value = sunSadNote;

    if (addHappyPresetBtn) addHappyPresetBtn.addEventListener('click', () => addPreset('happy', 'happyCustomInput', sunCustomHappy));
    if (addSadPresetBtn) addSadPresetBtn.addEventListener('click', () => addPreset('sad', 'sadCustomInput', sunCustomSad));

    const resetHappyBtn = document.getElementById('resetHappyPresetsBtn');
    const resetSadBtn = document.getElementById('resetSadPresetsBtn');
    if (resetHappyBtn) {
      resetHappyBtn.addEventListener('click', async () => {
        const ok = await confirmDialog('恢复默认小确幸预设？当前自定义预设将被清空。');
        if (!ok) return;
                sunCustomHappy = [];
        sunHiddenHappy = [];
        saveSunData();
        renderSunPanel();
        showToast('已重置默认预设');
      });
    }
    if (resetSadBtn) {
      resetSadBtn.addEventListener('click', async () => {
        const ok = await confirmDialog('恢复默认下雨了预设？当前自定义预设将被清空。');

        sunHiddenSad = [];

        showToast('已重置默认预设');
      });
    }
  }

    /* =========================================================
     数据备份 / 恢复
     ========================================================= */
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const s = reader.result || '';
        const idx = s.indexOf(',');
        resolve(idx >= 0 ? s.slice(idx + 1) : '');
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function base64ToBlob(b64, type) {
    const binary = atob(b64);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: type || 'audio/webm' });
  }

  async function exportAllData() {
    showToast('正在打包数据…');

    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      localStorage: {},
      recordings: []
    };

    // 1) 所有 localStorage 键
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        data.localStorage[k] = localStorage.getItem(k);
      }
    } catch (e) {}

    // 2) IndexedDB 里的录音
    try {
      const allDays = await dbGetAll();
      for (const day of allDays) {
        const segs = [];
        for (const seg of day.segments) {
          try {
            const b64 = await blobToBase64(seg.blob);
            segs.push({
              id: seg.id,
              title: seg.title,
              duration: seg.duration,
              createdAt: seg.createdAt,
              blobBase64: b64,
              blobType: (seg.blob && seg.blob.type) || 'audio/webm'
            });
          } catch (e) {}
        }
        data.recordings.push({ date: day.date, segments: segs });
      }
    } catch (e) {
      console.warn('录音读取失败', e);
    }

    const json = JSON.stringify(data);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '每日记备份_' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);

    showToast('已导出，请在「文件」App 中保存');
  }

  async function importAllData(file) {
    showToast('正在恢复数据…');
    try {
      const text = await file.text();
      const data = JSON.parse(text);

      if (!data || data.version !== 1) {
        showToast('备份文件格式不正确');
        return;
      }

      // 1) 恢复 localStorage
      if (data.localStorage && typeof data.localStorage === 'object') {
        Object.keys(data.localStorage).forEach((k) => {
          try { localStorage.setItem(k, data.localStorage[k]); } catch (e) {}
        });
      }

      // 2) 恢复录音
      if (Array.isArray(data.recordings)) {
        for (const day of data.recordings) {
          const segments = (day.segments || []).map((s) => ({
            id: s.id,
            title: s.title,
            duration: s.duration,
            createdAt: s.createdAt,
            blob: base64ToBlob(s.blobBase64, s.blobType)
          }));
          if (segments.length) {
            await dbPut({ date: day.date, segments });
          }
        }
      }

      showToast('恢复成功，即将刷新…');
      setTimeout(() => location.reload(), 1200);
    } catch (e) {
      console.error(e);
      showToast('恢复失败：' + (e && e.message ? e.message : e));
    }
  }

  try {
    document.getElementById('exportDataBtn').addEventListener('click', exportAllData);
    document.getElementById('importDataBtn').addEventListener('click', () => {
      document.getElementById('importDataFile').click();
    });
    document.getElementById('importDataFile').addEventListener('change', (e) => {

      e.target.value = '';
    });
  } catch (e) {}

  window.addEventListener('beforeunload', () => { saveTimers(); saveTodoData(); saveSunData(); });

})();
